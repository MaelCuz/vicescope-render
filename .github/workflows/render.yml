name: Teste de Renderização ViceScope

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vicescope-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    name: Renderizar vídeo ViceScope
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Baixar arquivos do ViceScope
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar FFmpeg e fontes
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python --version
          ffmpeg -version | head -n 1

      - name: Localizar renderizador
        id: localizar
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=$(find "$GITHUB_WORKSPACE" -type f -name "render.py" -not -path "*/.git/*" -print -quit)
          if [[ -z "$SCRIPT" ]]; then
            echo "::error::Arquivo render.py não encontrado."
            exit 1
          fi
          DIRETORIO=$(dirname "$SCRIPT")
          echo "Renderizador: $SCRIPT"
          echo "render_dir=$DIRETORIO" >> "$GITHUB_OUTPUT"
          test -f "$DIRETORIO/assets/narration.wav" || { echo "::error::Arquivo assets/narration.wav não encontrado."; exit 1; }

      - name: Renderizar vídeo
        working-directory: ${{ steps.localizar.outputs.render_dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          python render.py
          VIDEO=$(find output -maxdepth 1 -type f -name "*.mp4" -size +0c -print -quit)
          if [[ -z "$VIDEO" ]]; then
            echo "::error::Nenhum MP4 válido foi gerado."
            exit 1
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$VIDEO"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 "$VIDEO"

      - name: Salvar vídeo gerado
        uses: actions/upload-artifact@v4
        with:
          name: ViceScope-Video-${{ github.run_number }}
          path: ${{ steps.localizar.outputs.render_dir }}/output/*.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Resumo da renderização
        if: success()
        run: |
          echo "## ViceScope Render" >> "$GITHUB_STEP_SUMMARY"
          echo "Renderização concluída com sucesso." >> "$GITHUB_STEP_SUMMARY"
          echo "O vídeo está disponível em Artifacts." >> "$GITHUB_STEP_SUMMARY"
