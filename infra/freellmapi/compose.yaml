services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:v0.13.10
    container_name: fly-freellmapi
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      REQUEST_ANALYTICS_RETENTION_DAYS: 30
      REQUEST_ANALYTICS_MAX_ROWS: 10000
      TRUST_PROXY: "false"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /dados/fly/freellmapi/data:/app/server/data
    networks:
      - fly-ai
    restart: unless-stopped
    init: true
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/ping').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fly-ai:
    external: true
